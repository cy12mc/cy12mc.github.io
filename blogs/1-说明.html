<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>说明</title>
  <!-- KaTeX（CDN，GitHub Pages 可用） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text2: #8b949e;
      --accent: #58a6ff;
      --radius: 14px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .header-icons {
      position: fixed;
      top: 40px;
      right: 24px;
      display: flex;
      gap: 16px;
      z-index: 10;
    }

    .header-icons svg {
      color: var(--text2);
      cursor: pointer;
      width: 20px;
      height: 20px;
      transition: color 0.2s;
    }

    .header-icons svg:hover,
    .header-icons a:hover svg { color: var(--accent); }

    .header-icons button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .meta {
      color: var(--text2);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }
    .content {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }
    .content h2 { font-size: 1.3rem; margin: 24px 0 12px; }
    .content h3 { font-size: 1.1rem; margin: 20px 0 10px; }
    .content p  { margin-bottom: 12px; }
    .content ul, .content ol { margin: 12px 0 12px 20px; }
    .content li { margin-bottom: 4px; }
    .content code {
      background: var(--border);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.9em;
    }
    .content pre {
      background: var(--border);
      padding: 16px;
      border-radius: calc(var(--radius) / 2);
      overflow-x: auto;
      margin: 12px 0;
    }
    .content pre code { background: none; padding: 0; }
    .content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 16px;
      color: var(--text2);
      margin: 12px 0;
    }
    .content a { color: var(--accent); }
    .content img { max-width: 100%; border-radius: calc(var(--radius) / 2); }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    /* Math */
    .math-display {
      overflow-x: auto;
      padding: 8px 0;
      margin: 12px 0;
      text-align: center;
    }
    .content .katex { font-size: 1.05em; }
    .math-display .katex { font-size: 1.25em; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-icons">
      <a href="../index.html" id="homeBtn" style="display:flex;align-items:center;text-decoration:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 10.5 12 3.5l8 7"/>
          <path d="M6 9.5V20h4v-5h4v5h4V9.5"/>
        </svg>
      </a>
      <svg id="themeBtn" viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/>
      </svg>
    </div>
    <h1>说明</h1>
    <div class="meta">2026-11-06</div>
    <div class="content">
      <h1>关于这个网站</h1>
<h2>为什么会访问慢？</h2>
<p>网站托管在<a href="https://github.com">github</a>上，由于服务器在国外，访问可能会有点慢（尤其是图片），所以网站删去了动画和大部分图片，可能感觉生硬，不过换来了不错的性能。后续可能会通过腾讯服务加速。</p>
<p>想要加速，可以下载<a href="https://steampp.net/">watt toolkit（旧称steam++）</a>。</p>
<h2>网站干什么？</h2>
<p>这是<span class="math" data-tex="cy12"></span>数学的官方网站。如果你不知道<span class="math" data-tex="cy12"></span>是谁（<span class="math" data-tex="y"></span>代表什么? 阴<span class="math" data-tex="or"></span>阳），请离开网站。此网站会分享一些有用有趣的数学知识，帮助你提高思维，共同进步。</p>
    </div>
  </div>
  <script>
    // 渲染正文中的数学公式（content 由 generate.js 生成，.math 元素带 data-tex）
    function renderMath(el) {
      el.querySelectorAll('[data-tex]').forEach(n => {
        const tex = decodeURIComponent(n.dataset.tex);
        const display = n.closest('.math-display') !== null;
        try {
          katex.render(tex, n, { displayMode: display, throwOnError: false });
        } catch (e) { n.textContent = tex; }
      });
    }
    if (typeof katex !== 'undefined') {
      renderMath(document.querySelector('.content'));
    } else {
      document.querySelector('script[src*="katex.min.js"]').addEventListener('load', () => {
        renderMath(document.querySelector('.content'));
      });
    }

    // 深浅色切换（与 index.html 同款）
    const themeBtn = document.getElementById('themeBtn');
    const moonPath = '<path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/>';
    const sunPath  = '<circle cx="12" cy="12" r="4"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.3" y1="5.3" x2="7" y2="7"/><line x1="17" y1="17" x2="18.7" y2="18.7"/><line x1="5.3" y1="18.7" x2="7" y2="17"/><line x1="17" y1="7" x2="18.7" y2="5.3"/>';
    let dark = true;
    themeBtn.addEventListener('click', () => {
      dark = !dark;
      document.documentElement.style.setProperty('--bg', dark ? '#0d1117' : '#f6f8fa');
      document.documentElement.style.setProperty('--bg2', dark ? '#161b22' : '#ffffff');
      document.documentElement.style.setProperty('--border', dark ? '#30363d' : '#d0d7de');
      document.documentElement.style.setProperty('--text', dark ? '#e6edf3' : '#1f2328');
      document.documentElement.style.setProperty('--text2', dark ? '#8b949e' : '#656d76');
      document.documentElement.style.setProperty('--accent', dark ? '#58a6ff' : '#0969da');
      themeBtn.setAttribute('stroke', dark ? '#00d4ff' : '#f0883e');
      themeBtn.innerHTML = dark ? moonPath : sunPath;
    });
  </script>
</body>
</html>
