      <h1>平面直角坐标系</h1>
<img src="svg-1795230841928.svg" alt="alt text">
<h2>平面直角坐标系</h2>
<p>如图，平面直角坐标系由两个垂直的数轴组成，分别称为<span class="math" data-tex="x"></span>轴和<span class="math" data-tex="y"></span>轴。</p>
<h3>象限</h3>
<p>平面直角坐标系将平面分为四个象限，分别称为第一象限、第二象限、第三象限和第四象限，图中已标注。</p>
<h3>点的表示</h3>
<p>点的坐标表示为<span class="math" data-tex="(x%2Cy)"></span>，其中<span class="math" data-tex="x"></span>和<span class="math" data-tex="y"></span>分别是点在<span class="math" data-tex="x"></span>轴和<span class="math" data-tex="y"></span>轴上的坐标，如图，蓝色点的坐标为<span class="math" data-tex="(1%2C2)"></span>。</p>
<img src="svg-1795231201401.svg" alt="alt text">
    </article>

  <script src="../assets/site.js"></script>
  <script>
    /* 渲染正文中的数学公式（content 由 generate.js 生成，.math 元素带 data-tex） */
    function renderMath(el) {
      el.querySelectorAll('[data-tex]').forEach(function (n) {
        var tex = decodeURIComponent(n.dataset.tex);
        var display = n.closest('.math-display') !== null;
        try {
          katex.render(tex, n, { displayMode: display, throwOnError: false });
        } catch (e) { n.textContent = tex; }
      });
    }
    if (typeof katex !== 'undefined') {
      renderMath(document.querySelector('.content'));
    } else {
      document.querySelector('script[src*="katex.min.js"]').addEventListener('load', function () {
        renderMath(document.querySelector('.content'));
      });
    }
  </script>
