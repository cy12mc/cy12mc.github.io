      <h1>判别式<span class="math" data-tex="%5CDelta"></span>和解的特点</h1>
<h2>判别式的定义</h2>
<p>在1.2中，我们推导出了一元二次方程的求根公式：</p>
<div class="math-display"><span class="math" data-tex="x%3D%5Cfrac%7B-b%5Cpm%7B%5Csqrt%7Bb%5E2-4ac%7D%7D%7D%7B2a%7D"></span></div>
<p>我们知道，当<span class="math" data-tex="a%5Clt%200"></span>时，<span class="math" data-tex="%5Csqrt%7Ba%7D"></span>无意义。所以当<span class="math" data-tex="b%5E2-4ac%5Clt%200"></span>时方程无解。我们记<span class="math" data-tex="%5CDelta%3Db%5E2-4ac"></span>。</p>
<h2>解的特点</h2>
<p>显然，当<span class="math" data-tex="%5CDelta%5Cgt%200"></span>时，方程有两个不同的实数根。当<span class="math" data-tex="%5CDelta%20%3D0"></span>时，<span class="math" data-tex="-b%5Cpm%7B0%7D"></span>等价于<span class="math" data-tex="-b"></span>，方程有且只有一个实数根。当<span class="math" data-tex="%5CDelta%5Clt%200"></span>时，方程无解。</p>
<h2>韦达定理</h2>
<p>方程<span class="math" data-tex="ax%5E2%2Bbx%2Bc"></span>的解为：</p>
<div class="math-display"><span class="math" data-tex="%5Cbegin%7Bcases%7D%0D%0Ax_1%3D%5Cfrac%7B-b%2B%5Csqrt%7B%5CDelta%7D%7D%7B2a%7D%5Ctextcircled%7B1%7D%5C%5C%0D%0Ax_2%3D%5Cfrac%7B-b-%5Csqrt%7B%5CDelta%7D%7D%7B2a%7D%5Ctextcircled%7B2%7D%5C%5C%0D%0A%5Cend%7Bcases%7D"></span></div>
<p>观察式子，可以发现用<span class="math" data-tex="%5Ctextcircled%7B1%7D%2B%5Ctextcircled%7B2%7D"></span>可以消去<span class="math" data-tex="%5Csqrt%7B%5CDelta%7D"></span>：</p>
<div class="math-display"><span class="math" data-tex="x_1%2Bx_2%3D-%5Cfrac%7Bb%7D%7Ba%7D"></span></div>
<p>同时，用<span class="math" data-tex="%5Ctextcircled%7B1%7D%5Ctimes%5Ctextcircled%7B2%7D"></span>可以消去根号:</p>
<div class="math-display"><span class="math" data-tex="x_1%5Ccdot%20x_2%3D%5Cfrac%7B(-b%2B%5Csqrt%7B%5CDelta%7D)(-b-%5Csqrt%7B%5CDelta%7D)%7D%7B4a%5E2%7D%3D%5Cfrac%7Bb%5E2-%5CDelta%7D%7B4a%7D"></span></div>
<p>代入<span class="math" data-tex="%5CDelta%3Db%5E2-4ac"></span>，得到：</p>
<div class="math-display"><span class="math" data-tex="x_1%5Ccdot%20x_2%3D%5Cfrac%7B%5Ccancel%7Bb%5E2%7D-%5Ccancel%7Bb%5E2%7D%2B4ac%7D%7B4a%7D%3D%5Cfrac%7Bc%7D%7Ba%7D"></span></div>
<div class="math-display"><span class="math" data-tex="%5Ctextcolor%7Bturquoise%7D%7B%E9%9F%A6%E8%BE%BE%E5%AE%9A%E7%90%86%EF%BC%9A%E5%AF%B9%E4%BA%8E%E6%96%B9%E7%A8%8Bax%5E2%2Bbx%2Bc%3D0%EF%BC%8C%E4%B8%A4%E6%A0%B9%E4%B9%8B%E5%92%8C%E4%B8%BA-%5Cfrac%7Bb%7D%7Ba%7D%EF%BC%8C%E4%B8%A4%E6%A0%B9%E4%B9%8B%E7%A7%AF%E4%B8%BA%5Cfrac%7Bc%7D%7Ba%7D%E3%80%82%7D"></span></div>
