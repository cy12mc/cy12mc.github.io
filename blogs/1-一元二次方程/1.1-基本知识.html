<h2>根式的基本性质</h2>
<p>这一部分比较好理解。</p>
<div class="math-display"><span class="math" data-tex="%5Csqrt%7Ba%7D%5Ccdot%5Csqrt%7Bb%7D%3D%5Csqrt%7Bab%7D"></span></div>
<div class="math-display"><span class="math" data-tex="%5Cfrac%7B%5Csqrt%7Ba%7D%7D%7B%5Csqrt%7Bb%7D%7D%3D%5Csqrt%7B%5Cfrac%7Ba%7D%7Bb%7D%7D"></span></div>
<h2>根式化简</h2>
<p>我们一般将分母含根号的根式化简。例如：</p>
<div class="math-display"><span class="math" data-tex="%5Cfrac%7Bb%7D%7B%5Csqrt%7B2a%7D%7D"></span></div>
<p>为了使分母不含根号，可以上下同乘<span class="math" data-tex="%5Csqrt%7B2a%7D"></span>:</p>
<div class="math-display"><span class="math" data-tex="%5Cfrac%7Bb%7D%7B%5Csqrt%7B2a%7D%7D%3D%5Cfrac%7Bb%5Csqrt%7B2a%7D%7D%7B2a%7D"></span></div>

  <script>
    /* 渲染正文中的数学公式（content 由 generate.js 生成，.math 元素带 data-tex） */
    function renderMath(el) {
      el.querySelectorAll('[data-tex]').forEach(function (n) {
        var tex = decodeURIComponent(n.dataset.tex);
        var display = n.closest('.math-display') !== null;
        try {
          katex.render(tex, n, { displayMode: display, throwOnError: false });
        } catch (e) { n.textContent = tex; }
      });
    }
    if (typeof katex !== 'undefined') {
      renderMath(document.querySelector('.content'));
    } else {
      document.querySelector('script[src*="katex.min.js"]').addEventListener('load', function () {
        renderMath(document.querySelector('.content'));
      });
    }
  </script>
